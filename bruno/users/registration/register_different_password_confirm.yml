info:
  name: register_different_password_confirm
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}:{{port}}/api/users/register/"
  body:
    type: json
    data: |-
      {
        "username": "testuser",
        "email": "test@example.com",
        "password": "TestPassword123!",
        "password_confirm": "TestPassword123"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 Bad Request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Message is correct", function () {
          expect(res.getBody().username[0]).to.equal("A user with that username already exists.");
          expect(res.getBody().email[0]).to.equal("user with this email already exists.");
          
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
