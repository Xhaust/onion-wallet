info:
  name: register_weak_password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}:{{port}}/api/users/register/"
  body:
    type: json
    data: |-
      {
        "username": "testuser",
        "email": "test@example.com",
        "password": "test",
        "password_confirm": "test"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("400 Bad Request", function () {
          expect(res.getStatus()).to.equal(400);
        });
        test("Message is correct", function () {
          expect(res.getBody().password[0]).to.equal("This password is too short. It must contain at least 8 characters.");
          expect(res.getBody().password[1]).to.equal("This password is too common.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
