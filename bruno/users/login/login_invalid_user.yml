info:
  name: login_invalid_user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}:{{port}}/api/users/login/"
  body:
    type: json
    data: |-
      {
        "username": "testusero",
        "password": "TestPassword123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 Unauthorized", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("Message is correct", function () {
          expect(res.getBody().detail).to.equal("Invalid credentials.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
